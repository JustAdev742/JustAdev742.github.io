    <script>
      // Before first paint: enable the JS-only reveal states, and restore the
      // visitor's choice to pause ambient motion. If the app hasn't booted after
      // a few seconds, the page drops back to its no-JS rendering, so nothing
      // (text or images) stays hidden waiting for it.
      ;(function () {
        var root = document.documentElement
        root.classList.remove('no-js')
        root.classList.add('js')
        try {
          var motion = localStorage.getItem('jovian:motion')
          if (motion === 'paused' || motion === 'playing') root.dataset.motion = motion
        } catch (e) {}
        setTimeout(function () {
          if (!window.__jovianReady) root.classList.replace('js', 'no-js')
        }, 4000)
      })()
    </script>
